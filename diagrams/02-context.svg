<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="780" viewBox="0 0 1430 780" role="img"><title>Участники проверки маркетингового push-уведомления</title><desc>Люди и внешние системы показаны вокруг одного объекта проектирования. Стрелки подписаны передаваемыми данными.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.1 4 Z" fill="#435463" /></marker></defs><rect x="0" y="0" width="1430" height="780" fill="#ffffff" /><text x="40" y="40" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#314a5c" text-anchor="start">C4   /   УРОВЕНЬ 1: СИСТЕМНЫЙ КОНТЕКСТ</text><text x="40" y="91" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#172734" text-anchor="start">Участники проверки маркетингового push-уведомления</text><text x="1388" y="41" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#394854" text-anchor="end">РИСУНОК 2</text><polyline points="200,275 200,350" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="142,470 142,540" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="275,540 275,470" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="340,375 580,375" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="580,445 340,445" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="900,375 1125,375" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1125,443 900,443" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="740,562 740,485" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="60" y="170" width="280" height="105" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="61" y="182" width="4" height="81" rx="2" fill="#394854" /><text x="75" y="191.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ЧЕЛОВЕК</text><text x="75" y="216.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">Менеджер кампании</text><text x="75" y="239.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Выбирает аудиторию и</text><text x="75" y="258.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">планирует предложение.</text><rect x="60" y="540" width="280" height="110" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="61" y="552" width="4" height="86" rx="2" fill="#394854" /><text x="75" y="566.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ЧЕЛОВЕК</text><text x="75" y="590.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">Клиент банка</text><text x="75" y="611.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">Получает предложение и может</text><text x="75" y="628.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">отказаться от маркетинга.</text><rect x="60" y="350" width="280" height="120" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="61" y="362" width="4" height="96" rx="2" fill="#394854" /><text x="75" y="369.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ВНЕШНЯЯ СИСТЕМА</text><text x="75" y="394.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">CRM-платформа</text><text x="75" y="417.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Планирует кампанию,</text><text x="75" y="436.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">исполняет решение,</text><text x="75" y="455.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">регистрирует реакции.</text><rect x="580" y="335" width="320" height="150" rx="9" fill="#e1e8ec" stroke="#314a5c" stroke-width="1.5" /><rect x="581" y="347" width="4" height="126" rx="2" fill="#314a5c" /><text x="595" y="357.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">ПРОЕКТИРУЕМАЯ СИСТЕМА</text><text x="595" y="382.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">Контроль маркетинговых</text><text x="595" y="406.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">уведомлений</text><text x="595" y="429.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Оценивает риск отписки или</text><text x="595" y="448.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">жалобы; разрешает, откладывает</text><text x="595" y="467.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">или отменяет отправку.</text><rect x="1125" y="345" width="260" height="130" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="1126" y="357" width="4" height="106" rx="2" fill="#394854" /><text x="1140" y="370.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ВНЕШНЯЯ СИСТЕМА</text><text x="1140" y="394.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">Сервис согласий и</text><text x="1140" y="416.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">лимитов</text><text x="1140" y="437.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">Подтверждает разрешение и</text><text x="1140" y="454.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">резервирует единицу лимита.</text><rect x="595" y="562" width="290" height="107" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="596" y="574" width="4" height="83" rx="2" fill="#394854" /><text x="610" y="584.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ЧЕЛОВЕК</text><text x="610" y="609.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">ML-инженер</text><text x="610" y="632.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Проверяет новую версию и</text><text x="610" y="651.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">одобряет её публикацию.</text><rect x="203.515625" y="296.0" width="168.96875" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="288" y="309.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Параметры кампании</text><rect x="28.75" y="482.5" width="120.5" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="89" y="495.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Push с</text><text x="89" y="512.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">предложением</text><rect x="301.125" y="484.5" width="101.75" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="352" y="497.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Отписка или</text><text x="352" y="514.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">жалоба</text><rect x="380.328125" y="320.0" width="159.34375" height="53" rx="2" fill="#ffffff" opacity=".95" /><text x="460" y="333.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Запрос об отправке;</text><text x="460" y="350.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">события доставки и</text><text x="460" y="367.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">реакции</text><rect x="380.65625" y="419.0" width="158.6875" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="460" y="432.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Действие и причина</text><rect x="931.09375" y="327.5" width="165.8125" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="1014" y="340.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Запрос проверки или</text><text x="1014" y="357.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">резерва</text><rect x="929.328125" y="414.0" width="167.34375" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="1013" y="427.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Статус и разрешение</text><rect x="746.8203125" y="512.0" width="146.359375" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="820" y="525.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Одобрение версии</text><line x1="40" x2="1390" y1="729" y2="729" stroke="#c9d5d9" /><text x="41" y="755" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">Люди и внешние системы показаны вокруг одного объекта проектирования. Стрелки подписаны передаваемыми данными.</text></svg>
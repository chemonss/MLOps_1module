<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="1080" viewBox="0 0 1730 1080" role="img"><title>Архитектура проверки маркетингового push-уведомления</title><desc>Сплошная граница охватывает проектируемую систему. Внешние системы отделены; технология и назначение указаны в каждом контейнере.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.1 4 Z" fill="#435463" /></marker></defs><rect x="0" y="0" width="1730" height="1080" fill="#ffffff" /><text x="40" y="40" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#314a5c" text-anchor="start">C4   /   УРОВЕНЬ 2: КОНТЕЙНЕРЫ</text><text x="40" y="91" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#172734" text-anchor="start">Архитектура проверки маркетингового push-уведомления</text><text x="1688" y="41" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#394854" text-anchor="end">РИСУНОК 3</text><rect x="320" y="257" width="1370" height="740" rx="16" fill="#fbfdfd" stroke="#718c96" stroke-width="1.5" /><text x="660" y="287" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#314a5c" text-anchor="start">СИСТЕМА   /   Контроль маркетинговых уведомлений</text><polyline points="254,349 408,349" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="408,422 254,422" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="538,339 538,234" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="658,361 872,361" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="872,426 658,426" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1124,386 1373,386" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="145,432 145,660 408,660" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="535,451 535,605" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="658,659 872,659" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="999,605 999,532 1497,532 1497,451" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1070,451 1070,486 1320,486 1320,662 1373,662" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="956,721 956,775 536,775 536,836" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="872,891 658,891" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1124,891 1500,891 1500,721" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="31" y="307" width="223" height="125" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="32" y="319" width="4" height="101" rx="2" fill="#394854" /><text x="46" y="324.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ВНЕШНЯЯ СИСТЕМА</text><text x="46" y="348.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">CRM-платформа</text><text x="46" y="369.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">Запрашивает решение,</text><text x="46" y="386.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">отправляет уведомление</text><text x="46" y="403.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">и регистрирует</text><text x="46" y="420.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">результат.</text><rect x="404" y="128" width="270" height="106" rx="9" fill="#f1f2f3" stroke="#394854" stroke-width="1.5" /><rect x="405" y="140" width="4" height="82" rx="2" fill="#394854" /><text x="419" y="145.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#394854" text-anchor="start">ВНЕШНЯЯ СИСТЕМА</text><text x="419" y="167.5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#172734" text-anchor="start">Сервис согласий и</text><text x="419" y="187.5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#172734" text-anchor="start">лимитов</text><text x="419" y="206.5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#172734" text-anchor="start">Проверка согласия и атомарный</text><text x="419" y="221.5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#172734" text-anchor="start">резерв лимита (PostgreSQL).</text><rect x="408" y="339" width="250" height="112" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="409" y="351" width="4" height="88" rx="2" fill="#2b4355" /><text x="423" y="362.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">СЕРВИС</text><text x="423" y="384.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#172734" text-anchor="start">Сервис решений</text><text x="423" y="401.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#2b4355" text-anchor="start">Python / HTTP API</text><text x="423" y="418.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#172734" text-anchor="start">Применяет политику, возвращает</text><text x="423" y="433.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#172734" text-anchor="start">действие и причину.</text><rect x="872" y="339" width="252" height="112" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="873" y="351" width="4" height="88" rx="2" fill="#2b4355" /><text x="887" y="357.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">СЕРВИС</text><text x="887" y="381.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">ML-сервис</text><text x="887" y="400.5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#2b4355" text-anchor="start">Python / CatBoost</text><text x="887" y="420.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">Оценивает риск отписки или</text><text x="887" y="437.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">жалобы.</text><rect x="1373" y="339" width="258" height="112" rx="9" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.5" /><rect x="1374" y="351" width="4" height="88" rx="2" fill="#314a5c" /><text x="1388" y="362.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">ХРАНИЛИЩЕ</text><text x="1388" y="384.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#172734" text-anchor="start">Оперативные признаки</text><text x="1388" y="401.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#314a5c" text-anchor="start">Redis</text><text x="1388" y="418.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#172734" text-anchor="start">Хранит агрегаты по клиенту и</text><text x="1388" y="433.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#172734" text-anchor="start">отметку их свежести.</text><rect x="408" y="605" width="250" height="116" rx="9" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.5" /><rect x="409" y="617" width="4" height="92" rx="2" fill="#314a5c" /><text x="423" y="627.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">ШИНА СОБЫТИЙ</text><text x="423" y="650.5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#172734" text-anchor="start">Журнал событий</text><text x="423" y="668.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">Kafka</text><text x="423" y="687.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">Принимает решения, отправки,</text><text x="423" y="703.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">доставки и реакции.</text><rect x="872" y="605" width="252" height="116" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="873" y="617" width="4" height="92" rx="2" fill="#2b4355" /><text x="887" y="625.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">СЕРВИС</text><text x="887" y="649.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">Обработчик событий</text><text x="887" y="668.5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#2b4355" text-anchor="start">Python / клиент Kafka</text><text x="887" y="688.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">Удаляет повторы; обновляет</text><text x="887" y="705.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">признаки и историю.</text><rect x="1373" y="605" width="258" height="116" rx="9" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.5" /><rect x="1374" y="617" width="4" height="92" rx="2" fill="#314a5c" /><text x="1388" y="625.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">ХРАНИЛИЩЕ</text><text x="1388" y="649.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#172734" text-anchor="start">Реестр моделей</text><text x="1388" y="668.5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#314a5c" text-anchor="start">MLflow / хранилище артефактов</text><text x="1388" y="688.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">Хранит версии, схему</text><text x="1388" y="705.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#172734" text-anchor="start">признаков и метку champion.</text><rect x="408" y="836" width="250" height="116" rx="9" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.5" /><rect x="409" y="848" width="4" height="92" rx="2" fill="#314a5c" /><text x="423" y="858.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">ХРАНИЛИЩЕ</text><text x="423" y="881.5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#172734" text-anchor="start">История и витрины</text><text x="423" y="899.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">ClickHouse</text><text x="423" y="918.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">Хранит факты на момент</text><text x="423" y="934.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">решения, доставку и реакции.</text><rect x="872" y="836" width="252" height="116" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="873" y="848" width="4" height="92" rx="2" fill="#2b4355" /><text x="887" y="858.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">СЕРВИС</text><text x="887" y="881.5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#172734" text-anchor="start">Пакет обучения</text><text x="887" y="899.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">Python / SQL</text><text x="887" y="918.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">Строит метки, обучает модель;</text><text x="887" y="934.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">публикует одобренную версию.</text><rect x="289.2421875" y="312.5" width="81.515625" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="330" y="325.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Запрос об</text><text x="330" y="342.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">отправке</text><rect x="284.0" y="383.5" width="92.0" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="330" y="396.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Действие и</text><text x="330" y="413.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">причина</text><rect x="635.5859375" y="229.5" width="200.828125" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="736" y="242.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Проверка / резерв; статус</text><text x="736" y="259.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">и разрешение</text><rect x="698.9921875" y="333.0" width="132.015625" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="765" y="346.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Запрос прогноза</text><rect x="660.5234375" y="392.0" width="210.953125" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="766" y="405.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Риск и версия либо ошибка</text><rect x="1149.3828125" y="335.5" width="197.234375" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="1248" y="348.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Читает признаки и время</text><text x="1248" y="365.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">обновления</text><rect x="157.796875" y="611.5" width="212.40625" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="264" y="624.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Отправка, доставка,</text><text x="264" y="641.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">открытие, отписка, жалоба</text><rect x="563.15625" y="511.5" width="161.6875" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="644" y="524.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Публикует решение,</text><text x="644" y="541.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">причину, версию</text><rect x="692.125" y="629.0" width="145.75" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="765" y="642.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Передаёт события</text><rect x="1234.6015625" y="503.0" width="160.796875" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="1315" y="516.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Обновляет агрегаты</text><rect x="1117.015625" y="444.5" width="155.96875" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="1195" y="457.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Читает одобренную</text><text x="1195" y="474.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">версию и схему</text><rect x="636.4921875" y="737.5" width="193.015625" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="733" y="750.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Записывает историю без</text><text x="733" y="767.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">дублей</text><rect x="665.6796875" y="849.0" width="198.640625" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="765" y="862.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Читает события и исходы</text><rect x="1213.2421875" y="844.5" width="193.515625" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="1310" y="857.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Публикует модель после</text><text x="1310" y="874.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">одобрения</text><line x1="40" x2="1690" y1="1029" y2="1029" stroke="#c9d5d9" /><text x="41" y="1055" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">Сплошная граница охватывает проектируемую систему. Внешние системы отделены; технология и назначение указаны в каждом контейнере.</text></svg>
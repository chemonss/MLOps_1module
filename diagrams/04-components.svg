<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="775" viewBox="0 0 1490 775" role="img"><title>Расчёт риска отписки или жалобы перед отправкой push-уведомления</title><desc>Все компоненты входят в один ML-сервис. Его выход — прогноз для Сервиса решений, а не разрешение на отправку уведомления.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.1 4 Z" fill="#435463" /></marker></defs><rect x="0" y="0" width="1490" height="775" fill="#ffffff" /><text x="40" y="40" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#314a5c" text-anchor="start">C4   /   УРОВЕНЬ 3: КОМПОНЕНТЫ</text><text x="40" y="91" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#172734" text-anchor="start">Расчёт риска отписки или жалобы перед отправкой push-уведомления</text><text x="1448" y="41" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#394854" text-anchor="end">РИСУНОК 4</text><rect x="46" y="163" width="1398" height="487" rx="16" fill="#fbfdfd" stroke="#718c96" stroke-width="1.5" /><text x="66" y="193" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#314a5c" text-anchor="start">КОНТЕЙНЕР   /   ML-сервис  /  Python + CatBoost</text><polyline points="333,336 435,336" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="690,336 792,336" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1047,336 1150,336" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="920,487 920,411" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="777,548 561,548 561,411" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="565,267 565,226 1280,226 1280,267" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1062,553 1280,553 1280,411" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="78" y="267" width="255" height="144" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="79" y="279" width="4" height="120" rx="2" fill="#2b4355" /><text x="93" y="288.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">КОМПОНЕНТ</text><text x="93" y="313.5" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">Адаптер запроса</text><text x="93" y="334.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#2b4355" text-anchor="start">Python / HTTP</text><text x="93" y="355.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Принимает от Сервиса</text><text x="93" y="374.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">решений ключ попытки и</text><text x="93" y="393.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">сведения о сообщении.</text><rect x="435" y="267" width="255" height="144" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="436" y="279" width="4" height="120" rx="2" fill="#2b4355" /><text x="450" y="288.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">КОМПОНЕНТ</text><text x="450" y="313.5" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">Сборщик признаков</text><text x="450" y="334.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#2b4355" text-anchor="start">Python / клиент Redis</text><text x="450" y="355.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Читает агрегаты из Redis;</text><text x="450" y="374.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">проверяет состав и</text><text x="450" y="393.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">свежесть признаков.</text><rect x="792" y="267" width="255" height="144" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="793" y="279" width="4" height="120" rx="2" fill="#2b4355" /><text x="807" y="288.5" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">КОМПОНЕНТ</text><text x="807" y="313.5" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#172734" text-anchor="start">Модуль прогноза</text><text x="807" y="334.5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#2b4355" text-anchor="start">Python / CatBoost</text><text x="807" y="355.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">Рассчитывает вероятность</text><text x="807" y="374.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">отписки или жалобы после</text><text x="807" y="393.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#172734" text-anchor="start">доставки уведомления.</text><rect x="1150" y="267" width="255" height="144" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="1151" y="279" width="4" height="120" rx="2" fill="#2b4355" /><text x="1165" y="293.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">КОМПОНЕНТ</text><text x="1165" y="316.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#172734" text-anchor="start">Формирователь</text><text x="1165" y="337.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#172734" text-anchor="start">ответа</text><text x="1165" y="355.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">Python / HTTP</text><text x="1165" y="374.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">Возвращает в Сервис решений</text><text x="1165" y="390.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">p и версию либо код ошибки.</text><rect x="777" y="487" width="285" height="127" rx="9" fill="#f3f5f6" stroke="#2b4355" stroke-width="1.5" /><rect x="778" y="499" width="4" height="103" rx="2" fill="#2b4355" /><text x="792" y="507.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">КОМПОНЕНТ</text><text x="792" y="530.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#172734" text-anchor="start">Загрузчик версии</text><text x="792" y="548.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">Python / клиент MLflow</text><text x="792" y="567.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">Загружает из реестра одобренную</text><text x="792" y="583.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">модель и соответствующую схему</text><text x="792" y="599.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172734" text-anchor="start">признаков.</text><rect x="345.6328125" y="303.0" width="76.734375" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="384" y="316.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Контекст</text><rect x="710.859375" y="303.0" width="60.28125" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="741" y="316.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Вектор</text><rect x="1043.671875" y="303.0" width="110.65625" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="1099" y="316.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Риск и версия</text><rect x="961.1015625" y="434.0" width="157.796875" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="1040" y="447.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Одобренная модель</text><rect x="574.078125" y="518.0" width="165.84375" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="657" y="531.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Схема той же версии</text><rect x="831.2265625" y="188.5" width="183.546875" height="36" rx="2" fill="#ffffff" opacity=".95" /><text x="923" y="201.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Признаки устарели или</text><text x="923" y="218.5" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">недоступны</text><rect x="1099.6171875" y="517.0" width="184.765625" height="19" rx="2" fill="#ffffff" opacity=".95" /><text x="1192" y="530.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#435463" text-anchor="middle">Нет одобренной версии</text><line x1="40" x2="1450" y1="724" y2="724" stroke="#c9d5d9" /><text x="41" y="750" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">Все компоненты входят в один ML-сервис. Его выход — прогноз для Сервиса решений, а не разрешение на отправку уведомления.</text></svg>
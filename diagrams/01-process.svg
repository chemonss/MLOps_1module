<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="955" viewBox="0 0 1940 955" role="img"><title>Решение об отправке одного маркетингового push-уведомления</title><desc>Дорожки обозначают исполнителей; тонкий круг — начало, толстый круг — конец, ромб с крестом — выбор одного пути, стрелка — последовательность действий.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 L2.1 4 Z" fill="#435463" /></marker></defs><rect x="0" y="0" width="1940" height="955" fill="#ffffff" /><text x="40" y="40" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#314a5c" text-anchor="start">BPMN 2.0   /   БИЗНЕС-ПРОЦЕСС</text><text x="40" y="91" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#172734" text-anchor="start">Решение об отправке одного маркетингового push-уведомления</text><text x="1898" y="41" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#394854" text-anchor="end">РИСУНОК 1</text><rect x="40" y="128" width="1860" height="260" fill="#ffffff" stroke="#bdcbd2" /><rect x="40" y="128" width="155" height="260" fill="#edf0f2" stroke="#bdcbd2" /><text x="52" y="164" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#394854" text-anchor="start">CRM-платформа</text><rect x="40" y="388" width="1860" height="220" fill="#fafbfc" stroke="#bdcbd2" /><rect x="40" y="388" width="155" height="220" fill="#edf0f2" stroke="#bdcbd2" /><text x="52" y="424" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#394854" text-anchor="start">Сервис</text><text x="52" y="443" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#394854" text-anchor="start">решений</text><rect x="40" y="608" width="1860" height="143" fill="#ffffff" stroke="#bdcbd2" /><rect x="40" y="608" width="155" height="143" fill="#edf0f2" stroke="#bdcbd2" /><text x="52" y="644" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#394854" text-anchor="start">ML-сервис</text><rect x="40" y="751" width="1860" height="132" fill="#fafbfc" stroke="#bdcbd2" /><rect x="40" y="751" width="155" height="132" fill="#edf0f2" stroke="#bdcbd2" /><text x="52" y="787" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#394854" text-anchor="start">Контур данных</text><path d="M558,154 H547 V304 H558" stroke="#697984" stroke-width="2" fill="none" /><text x="564" y="174" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#34434e" text-anchor="start">B05. Приоритет условий при выборе действия</text><text x="564" y="199" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">1. Нет согласия или невозможно проверить согласие либо лимит → отменить.</text><text x="564" y="220" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">2. Нет пригодного прогноза или признаки старше 60 с → отложить.</text><text x="564" y="241" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">3. Пригодный прогноз: риск ≥ 0,15 → отменить.</text><text x="564" y="262" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">4. Риск от 0,05 до 0,15 (не включая 0,15) → отложить.</text><text x="564" y="283" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">5. Риск &lt; 0,05: лимит исчерпан → отложить; есть резерв → отправить.</text><polyline points="268,255 327,255" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="420,293 420,454" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="513,485 598,485 598,675 608,675" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="700,640 700,485 780,485" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="852,485 1167,485" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="816,521 816,555 913,555" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1116,555 1294,555 1294,526" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1294,442 1294,290" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1294,218 1294,177 1449,177" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1330,254 1455,254" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1312,272 1312,331 1455,331" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1649,254 1730,254" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1649,331 1730,331" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1649,177 1838,177 1838,815 1797,815" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1566,815 1407,815" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><polyline points="1169,815 1033,815" fill="none" stroke="#435463" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arr)" /><circle cx="248.0" cy="255.0" r="19.0" fill="white" stroke="#314a5c" stroke-width="2" /><text x="248.0" y="295" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Срок отправки</text><rect x="327" y="219" width="186" height="74" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="337" y="235" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B01</text><text x="420.0" y="253.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Запросить</text><text x="420.0" y="270.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">решение об</text><text x="420.0" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">отправке</text><polygon points="1294.0,218 1330,254.0 1294.0,290 1258,254.0" fill="#f4f4f4" stroke="#515c64" stroke-width="2" /><text x="1294.0" y="262.0" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#34434e" text-anchor="middle">×</text><text x="1250" y="258" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="end">Действие?</text><rect x="1449" y="149" width="200" height="57" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="1459" y="165" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B06</text><text x="1549.0" y="183.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Отправить</text><text x="1549.0" y="200.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">уведомление</text><rect x="1455" y="226" width="194" height="57" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="1465" y="242" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B07</text><text x="1552.0" y="269.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Перенести попытку</text><rect x="1455" y="303" width="194" height="57" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="1465" y="319" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B08</text><text x="1552.0" y="346.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Отменить отправку</text><circle cx="1749.5" cy="253.5" r="18.5" fill="white" stroke="#172734" stroke-width="4" /><text x="1749.5" y="293" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Отложено</text><circle cx="1749.5" cy="330.5" r="18.5" fill="white" stroke="#172734" stroke-width="4" /><text x="1749.5" y="370" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Отменено</text><rect x="327" y="454" width="186" height="68" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="337" y="470" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B02</text><text x="420.0" y="502.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Запросить прогноз</text><polygon points="816.0,449 852,485.0 816.0,521 780,485.0" fill="#f4f4f4" stroke="#515c64" stroke-width="2" /><text x="816.0" y="493.0" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#34434e" text-anchor="middle">×</text><text x="816.0" y="436" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Прогноз пригоден?</text><rect x="913" y="523" width="203" height="63" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="923" y="539" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B04</text><text x="1014.5" y="560.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Применить запасное</text><text x="1014.5" y="577.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">правило</text><rect x="1167" y="442" width="254" height="84" rx="10" fill="#f4f6f7" stroke="#2b4355" stroke-width="1.7" /><text x="1177" y="458" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2b4355" text-anchor="start">B05</text><text x="1294.0" y="481.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Проверить согласие и</text><text x="1294.0" y="498.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">лимит; выбрать и записать</text><text x="1294.0" y="515.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">действие</text><rect x="608" y="640" width="185" height="70" rx="10" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.7" /><text x="618" y="656" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">B03</text><text x="700.5" y="672.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Рассчитать риск</text><text x="700.5" y="689.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">отписки или</text><text x="700.5" y="706.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">жалобы</text><rect x="1566" y="781" width="231" height="67" rx="10" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.7" /><text x="1576" y="797" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">B09</text><text x="1681.5" y="820.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Связать события с</text><text x="1681.5" y="837.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">решением</text><rect x="1169" y="781" width="238" height="67" rx="10" fill="#f2f5f6" stroke="#314a5c" stroke-width="1.7" /><text x="1179" y="797" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#314a5c" text-anchor="start">B10</text><text x="1288.0" y="820.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Сформировать метку</text><text x="1288.0" y="837.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">или исключить пример</text><circle cx="1013.0" cy="815.0" r="19.0" fill="white" stroke="#172734" stroke-width="4" /><text x="1013.0" y="855" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172734" text-anchor="middle">Исход учтён</text><rect x="884.703125" y="456.0" width="230.59375" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="1000" y="468.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">Да: получен пригодный прогноз</text><rect x="846.3203125" y="533.0" width="33.359375" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="863" y="545.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">Нет</text><rect x="1315.3984375" y="391.0" width="143.203125" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="1387" y="403.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">Решение и причина</text><rect x="1345.8984375" y="151.0" width="44.203125" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="1368" y="163.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">SEND</text><rect x="1364.515625" y="226.0" width="50.96875" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="1390" y="238.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">DEFER</text><rect x="1374.3984375" y="302.0" width="75.203125" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="1412" y="314.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">SUPPRESS</text><rect x="1578.0703125" y="649.0" width="223.859375" height="34" rx="2" fill="#ffffff" opacity=".95" /><text x="1690" y="661.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">Факт отправки и последующие</text><text x="1690" y="677.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">события</text><rect x="1400.8984375" y="764.0" width="174.203125" height="18" rx="2" fill="#ffffff" opacity=".95" /><text x="1488" y="776.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#435463" text-anchor="middle">Наблюдение завершено</text><line x1="40" x2="1900" y1="904" y2="904" stroke="#c9d5d9" /><text x="41" y="930" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#394854" text-anchor="start">Дорожки обозначают исполнителей; тонкий круг — начало, толстый круг — конец, ромб с крестом — выбор одного пути, стрелка — последовательность действий.</text></svg>
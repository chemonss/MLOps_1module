apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: fraud
    jsonData:
      database: fraud_monitoring
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: fraud_password
    editable: false

apiVersion: 1

groups:
  - orgId: 1
    name: Fraud Scoring Alerts
    folder: Fraud Detection
    interval: 10s
    rules:
      - uid: fraud_high_rate
        title: High Fraud Rate
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: 'sum(increase(fraud_scoring_fraud_total[1m])) / clamp_min(sum(increase(fraud_scoring_processed_total[1m])), 1)'
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.20]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Fraud rate exceeds 20 percent
        labels:
          severity: warning
        isPaused: false

      - uid: fraud_high_latency
        title: High Scoring Latency
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: 'sum(increase(fraud_scoring_duration_seconds_sum[1m])) / clamp_min(sum(increase(fraud_scoring_duration_seconds_count[1m])), 1)'
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Average scoring latency exceeds 0.5 seconds
        labels:
          severity: warning
        isPaused: false
